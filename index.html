<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warakorn's Manga Shelf — คลังมังงะของวรากรณ์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="curtain-intro" aria-hidden="true">
    <span class="curtain curtain-left"></span>
    <span class="curtain curtain-right"></span>
    <span class="curtain-seam"></span>
  </div>
  <main class="page">
    <nav><div class="brand"><i class="mark"></i>Warakorn's Manga Shelf</div><div class="counter" id="totalCounter"></div></nav>
    <div id="collectionView">
      <header>
        <h1>หอคอยแห่ง<br><em>รัตติกาล</em></h1>
        <p class="intro">คอลเลกชันเรื่องราวใต้เงาจันทร์ เลือกคัมภีร์ที่สนใจ เพื่อดูจำนวนเล่มที่เก็บสะสมไว้ในคลังลับ</p>
      </header>
      <section aria-labelledby="collectionTitle">
        <div class="section-head"><h2 id="collectionTitle">THE FORBIDDEN ARCHIVE</h2><span>เลือกเรื่องเพื่อดูรายละเอียด</span></div>
        <div class="manga-grid" id="mangaGrid"></div>
      </section>
    </div>
    <section class="series-page" id="seriesPage" hidden aria-live="polite">
      <button class="back-button" id="backButton" type="button">← กลับสู่คลังมังงะ</button>
      <div class="series-hero"><span class="series" id="seriesNumber"></span><h2 id="seriesTitle"></h2><p id="seriesDescription"></p></div>
      <div class="section-head"><h2>VOLUMES IN THE ARCHIVE</h2><span id="seriesCount"></span></div>
      <div class="volume-list" id="volumeList"></div>
    </section>
    <footer><span>PERSONAL MANGA ARCHIVE</span><span>© 2026</span></footer>
    <img class="flame-footer" src="images/flame_2.gif" alt="" aria-hidden="true" />
  </main>
  <dialog id="detailDialog">
    <article class="modal">
      <button class="close" aria-label="ปิด" onclick="detailDialog.close()">×</button>
      <div class="modal-series" id="modalNo"></div><h3 id="modalTitle"></h3>
      <div class="volume-count"><span>จำนวนที่สะสมไว้</span><div class="number"><span id="modalVolumes"></span><small>เล่ม</small></div></div>
      <p class="status" id="modalStatus"></p>
    </article>
  </dialog>
  <script>
    // แก้ไขรายชื่อและจำนวนเล่มสะสมได้ที่นี่
    const mangas = [
      { title: 'Innocent \n(อีนอซอง)', volumes: 4, showroom: 'images/innocent_showroom.jpg', status: 'มีชายผู้หนึ่ง ที่เป็นตัวเอกอีกคนของช่วงเวลาอันมืดมิดนั้น เขาคือ ชาลส์-อ็องรี ซ็องซง ผู้นำตระกูลซ็องซง รุ่นที่ 4 ตระกูลซึ่งต้องรับสืบทอดตำแหน่ง เพชฌฆาตหลวงแห่งกรุงปารีส!!', covers: ['images/innocent_vol_1.png', 'images/innocent_vol_2.png', 'images/innocent_vol_3.png', 'images/innocent_vol_4.png'] },
      { title: '#DRCL midnight children \n(คืนวิปลาส รัตติกาลต้องสาป)', volumes: 2, showroom: 'images/DRCL_showroom.jpg', status: 'เรือดีมีเทอร์สัญชาติรัสเซีย ได้บรรทุกกล่องไม้แปลกประหลาดจากท่าเรือวาร์นาและออกจากท่าเรือ มุ่งสู่อังกฤษทว่าภายในเรือกลับเกิดเหตุน่าสยดสยองขึ้น!!', covers: ['images/drcl_vol_1.png', 'images/drcl_vol_2.png'] },
      { title: 'Chainsaw man \n(มนุษย์เลื่อยยนต์)', volumes: 6, showroom: 'images/chainsawman_showroom.jpg', status: 'เด็นจิเด็กหนุ่มที่จนกรอบยิ่งกว่ากรอบโดนจิกหัวใช้ในฐานะนักล่าปิศาจร่วมกับปิศาจโปจิตะ!!', covers: ['images/Chainsawman/chainsawman_vol_1.png', 'images/Chainsawman/chainsawman_vol_2.png', 'images/Chainsawman/chainsawman_vol_9.png', 'images/Chainsawman/chainsawman_vol_10.png', 'images/Chainsawman/chainsawman_vol_12.png', 'images/Chainsawman/chainsawman_vol_21.png'] },
      { title: 'Fire punch', volumes: 4, showroom: 'images/firepunch_showroom.jpg', status: '"แม่มดน้ำแข็ง"ทำให้โลกถุกปกคลุมไปด้วยหิมะความอดอยาก และความบ้าคลั่งผู้คนที่เหน็บหนาว ล้วนปรารถนาเปลวเพลิง...', covers: ['images/Firepunch/firepunch_vol_1.png', 'images/Firepunch/firepunch_vol_3.png', 'images/Firepunch/firepunch_vol_4.png', 'images/Firepunch/firepunch_vol_8.png'] },
      { title: 'TRUMP \n(ตำนานเผ่าดูดเลือด)', volumes: 1, showroom: 'images/trump_showroom.jpg', status: 'เรื่องราวลึกลับว่าด้วยชะตากรรมของเหล่าเด็กหนุ่มเผ่าดูดเลือดซึ่งสูญเสียความเป็นอมตะไปแล้วและถูกหลอกหลอนด้วยตำนานของ "TRUMP" ผู้มีชีวิตนิรันดร์!!', covers: ['images/Trump/trump_vol_1.png'] },
      { title: 'Blue Lock \n(ขังดวลแข้ง)', volumes: 2, showroom: 'images/blueLock_showroom.jpg', status: 'โปรเจกต์สร้างกองหน้าที่เห็นแก่ตัวที่สุดในโลก!!', covers: ['images/BlueLock/bluelock_vol_1.png', 'images/BlueLock/bluelock_vol_2.png'] },
      { title: 'Yahari (นิยาย)\n(กะแล้วชีวิตรักวัยรุ่นของผมมันต้องไม่สดใสเลยสักนิด)', volumes: 3, showroom: 'images/yahari_showroom.jpg', status: 'เรื่องราวของนักเรียนมัธยมปลายที่ถูกบังคับให้เข้าร่วมชมรมกิจกรรมเพื่อสังคมและต้องแก้ไขปัญหาของเพื่อนร่วมชั้น', covers: ['images/Yahari/yahari_vol_1.png', 'images/Yahari/yahari_vol_2.png', 'images/Yahari/yahari_vol_3.png'] }
    ];
    const grid = document.getElementById('mangaGrid');
    const dialog = document.getElementById('detailDialog');
    const collectionView = document.getElementById('collectionView');
    const seriesPage = document.getElementById('seriesPage');
    const volumeList = document.getElementById('volumeList');
    const total = mangas.reduce((sum, manga) => sum + manga.volumes, 0);
    document.getElementById('totalCounter').textContent = `${mangas.length} เรื่อง · ${total} เล่ม`;
    mangas.forEach((manga, index) => {
      const card = document.createElement('button');
      const icon = manga.covers?.[0];
      card.className = 'manga-card'; card.type = 'button';
      card.innerHTML = `${icon ? `<img class="manga-icon" src="${icon}" alt="ปก ${manga.title.replace(/\n/g, ' ')} เล่ม 1">` : '<span class="manga-icon manga-icon-placeholder" aria-hidden="true">✦</span>'}<span class="series">SERIES ${String(index + 1).padStart(2, '0')}</span><span class="title">${manga.title}</span><span class="card-bottom"><span>${manga.volumes} เล่มในชั้น</span><span class="arrow">→</span></span>`;
      card.addEventListener('click', () => {
        if (manga.covers?.length) { showSeries(manga, index); return; }
        document.getElementById('modalNo').textContent = `SERIES ${String(index + 1).padStart(2, '0')}`;
        document.getElementById('modalTitle').textContent = manga.title;
        document.getElementById('modalVolumes').textContent = manga.volumes;
        document.getElementById('modalStatus').textContent = manga.status;
        dialog.showModal();
      });
      grid.appendChild(card);
    });
    function showSeries(manga, index) {
      seriesPage.classList.toggle('has-showroom', Boolean(manga.showroom));
      seriesPage.style.setProperty('--showroom-image', manga.showroom ? `url("${manga.showroom}")` : 'none');
      document.getElementById('seriesNumber').textContent = `SERIES ${String(index + 1).padStart(2, '0')}`;
      document.getElementById('seriesTitle').textContent = manga.title;
      document.getElementById('seriesDescription').textContent = manga.status;
      document.getElementById('seriesCount').textContent = `${manga.covers.length} เล่มในคอลเลกชัน`;
      volumeList.replaceChildren();
      const volumeSeriesName = manga.title.replace(/\n/g, ' ').split('(')[0].trim();
      manga.covers.forEach((cover, volumeIndex) => {
        const volume = document.createElement('article');
        volume.className = 'volume-card';
        volume.innerHTML = `<span class="volume-number">VOLUME ${String(volumeIndex + 1).padStart(2, '0')}</span><img src="${cover}" alt="ปก ${volumeSeriesName} เล่ม ${volumeIndex + 1}"><div class="volume-info"><span>${volumeSeriesName}</span><h3>เล่มที่ ${volumeIndex + 1}</h3><p>จัดเก็บในคลังมังงะ</p></div>`;
        volumeList.appendChild(volume);
      });
      collectionView.hidden = true;
      seriesPage.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    document.getElementById('backButton').addEventListener('click', () => {
      seriesPage.hidden = true;
      collectionView.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('pageshow', () => {
      const curtain = document.querySelector('.curtain-intro');
      requestAnimationFrame(() => curtain.classList.add('is-opening'));
    });
  </script>
</body>
</html>
